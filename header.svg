<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.55" stop-color="#203a43"/>
      <stop offset="1" stop-color="#00D4AA"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#g)"/>
  <rect width="1200" height="260" rx="18" fill="url(#dots)"/>
  <circle cx="1080" cy="60" r="90" fill="#00D4AA" opacity="0.15">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="200" r="50" fill="#ffffff" opacity="0.06"/>
  <text x="70" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" opacity="0">
    Rishika Guggilam
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="72" y="172" font-family="Consolas, Menlo, monospace" font-size="22" fill="#00D4AA" opacity="0">
    &gt; AI &amp; Backend Engineer  ·  Agentic AI  ·  Generative AI
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
  </text>
  <rect x="72" y="198" width="0" height="4" rx="2" fill="#00D4AA">
    <animate attributeName="width" from="0" to="160" begin="1s" dur="1s" fill="freeze"/>
  </rect>
</svg>
