<svg xmlns="http://www.w3.org/2000/svg" width="700" height="50" viewBox="0 0 700 50" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:Consolas,Menlo,monospace;font-size:22px;font-weight:600;fill:#00D4AA}
    .l{opacity:0;animation:show 12s infinite}
    .l2{animation-delay:3s}.l3{animation-delay:6s}.l4{animation-delay:9s}
    @keyframes show{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
  </style>
  <text class="l"    x="350" y="32" text-anchor="middle">I build agents that talk to agents</text>
  <text class="l l2" x="350" y="32" text-anchor="middle">Orchestrating 28+ specialised AI agents</text>
  <text class="l l3" x="350" y="32" text-anchor="middle">From LLM prototypes to production APIs</text>
  <text class="l l4" x="350" y="32" text-anchor="middle">Turning aerospace workflows into conversations</text>
</svg>
